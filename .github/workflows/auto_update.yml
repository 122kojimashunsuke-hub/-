name: Update Property Data

on:
  schedule:
    # 毎朝7:00（JST）に自動実行
    - cron: '0 22 * * *'
  # 手動でいつでも即時実行できるボタン
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: リポジトリの取得
        uses: actions/checkout@v4

      - name: Pythonの準備
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 必要なパッケージのインストール
        run: |
          pip install requests beautifulsoup4 pytz

      - name: 物件データ更新スクリプトを実行
        run: |
          python update_properties.py

      - name: 変更をGitHubに反映
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update property data [skip ci]" && git push)
