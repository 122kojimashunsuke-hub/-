<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23区 実需マンション値下げ速報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5 text-xs text-emerald-400 font-medium">
          <i class="fa-solid fa-bolt"></i>
          <span>23区 実需限定モニター（成約圏内のみ）</span>
        </div>
        <h1 class="text-lg font-bold tracking-tight">値下げ速報</h1>
        <p id="stats-banner" class="text-[11px] text-slate-300 mt-0.5">データ読み込み中...</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchDeals()" title="更新" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-full">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button onclick="openModal()" title="内訳ログ" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-full">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
    </div>

    <!-- 絞り込みバー -->
    <div class="max-w-xl mx-auto px-4 pb-2.5 flex items-center gap-2">
      <select id="ward-filter" onchange="renderCards()" class="text-xs bg-slate-800 text-white rounded px-2.5 py-1.5 border border-slate-700 focus:outline-none">
        <option value="ALL">23区すべて（お買い得順）</option>
      </select>
      <input type="text" id="search-input" oninput="renderCards()" placeholder="物件名・駅名で絞り込み..." class="text-xs flex-1 bg-slate-800 text-white rounded px-3 py-1.5 border border-slate-700 focus:outline-none placeholder-slate-400">
    </div>
  </header>

  <!-- メインリスト -->
  <main class="max-w-xl mx-auto px-4 mt-4 space-y-3" id="cards-container">
    <!-- カードがここに自動展開 -->
  </main>

  <!-- 監査・内訳モーダル -->
  <div id="log-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-sm text-slate-800">検知内訳・見送りログ</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="log-summary" class="text-xs space-y-1.5 bg-slate-50 p-3 rounded-lg border"></div>
      <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="log-excluded-list"></div>
      <button onclick="closeModal()" class="w-full py-2 bg-slate-900 text-white text-xs rounded-lg font-medium">閉じる</button>
    </div>
  </div>

  <script>
    let globalData = { properties: [], stats: {}, excluded: [] };
    const WARDS = ["千代田区","中央区","港区","新宿区","文京区","台東区","墨田区","江東区","品川区","目黒区","大田区","世田谷区","渋谷区","中野区","杉並区","豊島区","北区","荒川区","板橋区","練馬区","足立区","葛飾区","江戸川区"];

    const wardSelect = document.getElementById("ward-filter");
    WARDS.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w;
      opt.textContent = w;
      wardSelect.appendChild(opt);
    });

    async function fetchDeals() {
      const container = document.getElementById("cards-container");
      container.innerHTML = '<div class="text-center py-12 text-slate-400 text-xs">最新データを取得中...</div>';
      
      try {
        const res = await fetch(`data/latest_deals.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Not Found");
        globalData = await res.json();
        
        const s = globalData.stats;
        document.getElementById("stats-banner").innerHTML = 
          `<span class="text-slate-400">${globalData.updated_at} 更新</span> ｜ 本日 <span class="font-bold text-white">${s.total_detected || 0}件</span> 検知 ➜ 提案推奨 <span class="font-bold text-emerald-400">${s.recommended || 0}件</span>`;

        renderCards();
      } catch (err) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-xl border text-center space-y-2">
            <p class="font-bold text-sm text-slate-700">速報データはありません</p>
            <p class="text-xs text-slate-400">Actionsを実行するか、メールの巡回をお待ちください。</p>
          </div>`;
      }
    }

    function renderCards() {
      const container = document.getElementById("cards-container");
      const selectedWard = document.getElementById("ward-filter").value;
      const query = document.getElementById("search-input").value.toLowerCase();

      let list = globalData.properties || [];
      if (selectedWard !== "ALL") {
        list = list.filter(p => p.ward === selectedWard);
      }
      if (query) {
        list = list.filter(p => p.name.toLowerCase().includes(query));
      }

      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">条件に合致する物件はありません</div>';
        return;
      }

      container.innerHTML = list.map(p => {
        const mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.ward + " " + p.name)}`;
        const sourceLabel = p.source ? `<span class="text-[10px] bg-slate-100 text-slate-600 px-1.5 py-0.5 rounded border border-slate-200">${p.source}</span>` : '';

        // 金額フォーマット（億単位対応）
        const formatYen = (num) => {
          if (num >= 10000) {
            const oku = Math.floor(num / 10000);
            const man = num % 10000;
            return `${oku}億${man > 0 ? man.toLocaleString() : ''}万円`;
          }
          return `${num.toLocaleString()}万円`;
        };

        return `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 hover:border-slate-300 transition-colors">
          <!-- 上段: 物件名・価格 -->
          <div class="flex items-start justify-between gap-3">
            <div class="space-y-1">
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="px-2 py-0.5 bg-slate-900 text-white text-[10px] font-bold rounded">${p.ward}</span>
                ${sourceLabel}
              </div>
              <h2 class="font-bold text-sm text-slate-900 leading-snug">${p.name}</h2>
              <div class="flex items-center gap-3 text-xs text-slate-500 pt-0.5">
                <span>${p.area}㎡</span>
                <span>坪${p.tsubo_price}万</span>
                <a href="${mapUrl}" target="_blank" rel="noopener noreferrer" class="text-indigo-600 hover:text-indigo-800 font-medium flex items-center gap-0.5 text-[11px] underline">
                  <i class="fa-solid fa-location-dot"></i> Map
                </a>
              </div>
            </div>
            <div class="text-right flex-shrink-0">
              <span class="inline-block px-2 py-0.5 bg-rose-50 text-rose-600 border border-rose-200 text-[10px] font-bold rounded">
                -${p.price_drop}万 (${p.gap_rate}%)
              </span>
              <div class="text-base font-extrabold text-slate-900 mt-1">${formatYen(p.price)}</div>
              <div class="text-[10px] text-slate-400 line-through">${formatYen(p.previous_price)}</div>
            </div>
          </div>

          <!-- 下段: 予想成約ライン -->
          <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-xs">
            <span class="text-slate-500 flex items-center gap-1 font-medium text-[11px]">
              <i class="fa-solid fa-bullseye text-emerald-500"></i> 予想成約ライン
            </span>
            <span class="font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200 text-[11px]">
              ${p.deal_line || '算出中'}
            </span>
          </div>
        </div>
        `;
      }).join('');
    }

    function openModal() {
      const s = globalData.stats || {};
      const bySourceHtml = s.by_source ? Object.entries(s.by_source).map(([k, v]) => `
        <div class="flex justify-between text-slate-600"><span>${k}:</span><span>${v}件</span></div>
      `).join('') : '';

      document.getElementById("log-summary").innerHTML = `
        <div class="flex justify-between font-bold text-slate-800 border-b pb-1"><span>総検知件数:</span><span>${s.total_detected || 0}件</span></div>
        <div class="py-1 space-y-0.5 text-[11px]">
          ${bySourceHtml}
        </div>
        <div class="flex justify-between text-slate-500 border-t pt-1"><span>実需外除外 (40㎡/5000万未満):</span><span>${s.excluded_conditions || 0}件</span></div>
        <div class="flex justify-between text-emerald-600 font-bold border-t pt-1"><span>提案推奨掲載:</span><span>${s.recommended || 0}件</span></div>
      `;

      const listContainer = document.getElementById("log-excluded-list");
      const list = globalData.excluded || [];
      if (list.length === 0) {
        listContainer.innerHTML = '<p class="text-slate-400 text-[11px]">除外・見送り物件の記録はありません</p>';
      } else {
        listContainer.innerHTML = list.map(item => `
          <div class="p-2 bg-slate-50 rounded border text-[11px]">
            <div class="font-bold text-slate-700">${item.ward} ｜ ${item.name}</div>
            <div class="text-rose-500">${item.reason}</div>
          </div>
        `).join('');
      }

      document.getElementById("log-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("log-modal").classList.add("hidden");
    }

    fetchDeals();
  </script>
</body>
</html>
