<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>23区 実需マンション値下げ速報</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen pb-12">

  <!-- ヘッダー -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-1.5 text-xs text-emerald-400 font-medium">
          <i class="fa-solid fa-shield-halved"></i>
          <span>23区 実需限定モニター（成約圏内のみ）</span>
        </div>
        <h1 class="text-lg font-bold tracking-tight">値下げ・指値妙味 速報</h1>
        <p id="stats-banner" class="text-[11px] text-slate-300 mt-0.5">データ読み込み中...</p>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="fetchDeals()" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-full">
          <i class="fa-solid fa-rotate"></i>
        </button>
        <button onclick="openModal()" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-full">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
    </div>

    <!-- 簡易区絞り込み（任意用） -->
    <div class="max-w-xl mx-auto px-4 pb-2.5 flex items-center gap-2">
      <select id="ward-filter" onchange="renderCards()" class="text-xs bg-slate-800 text-white rounded px-2.5 py-1.5 border border-slate-700 focus:outline-none">
        <option value="ALL">23区すべて（お買い得順）</option>
      </select>
      <input type="text" id="search-input" oninput="renderCards()" placeholder="物件名・駅名で絞り込み..." class="text-xs flex-1 bg-slate-800 text-white rounded px-3 py-1.5 border border-slate-700 focus:outline-none placeholder-slate-400">
    </div>
  </header>

  <!-- メインリスト -->
  <main class="max-w-xl mx-auto px-4 mt-4 space-y-4" id="cards-container">
    <!-- カードがここに自動展開 -->
  </main>

  <!-- 監査・除外ログモーダル -->
  <div id="log-modal" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-xl max-w-md w-full p-5 space-y-4 max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b pb-2">
        <h3 class="font-bold text-sm text-slate-800">検知内訳・見送りログ</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>
      <div id="log-summary" class="text-xs space-y-1.5 bg-slate-50 p-3 rounded-lg border"></div>
      <div class="flex-1 overflow-y-auto space-y-2 pr-1" id="log-excluded-list"></div>
      <button onclick="closeModal()" class="w-full py-2 bg-slate-900 text-white text-xs rounded-lg font-medium">閉じる</button>
    </div>
  </div>

  <script>
    let globalData = { properties: [], stats: {}, excluded: [] };
    const WARDS = ["千代田区","中央区","港区","新宿区","文京区","台東区","墨田区","江東区","品川区","目黒区","大田区","世田谷区","渋谷区","中野区","杉並区","豊島区","北区","荒川区","板橋区","練馬区","足立区","葛飾区","江戸川区"];

    // 区セレクトボックス初期化
    const wardSelect = document.getElementById("ward-filter");
    WARDS.forEach(w => {
      const opt = document.createElement("option");
      opt.value = w;
      opt.textContent = w;
      wardSelect.appendChild(opt);
    });

    async function fetchDeals() {
      const container = document.getElementById("cards-container");
      container.innerHTML = '<div class="text-center py-12 text-slate-400 text-xs">最新データを取得中...</div>';
      
      try {
        const res = await fetch(`data/latest_deals.json?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error("Not Found");
        globalData = await res.json();
        
        // ヘッダー統計表示
        const s = globalData.stats;
        document.getElementById("stats-banner").innerHTML = 
          `<span class="text-slate-400">${globalData.updated_at} 更新</span> ｜ 本日 <span class="font-bold text-white">${s.total_detected || 0}件</span> 検知 ➜ 提案推奨 <span class="font-bold text-emerald-400">${s.recommended || 0}件</span>`;

        renderCards();
      } catch (err) {
        container.innerHTML = `
          <div class="bg-white p-6 rounded-xl border text-center space-y-2">
            <p class="font-bold text-sm text-slate-700">成約圏内の速報データはありません</p>
            <p class="text-xs text-slate-400">Actionsを実行するか、メールの巡回をお待ちください。</p>
          </div>`;
      }
    }

    function renderCards() {
      const container = document.getElementById("cards-container");
      const selectedWard = document.getElementById("ward-filter").value;
      const query = document.getElementById("search-input").value.toLowerCase();

      let list = globalData.properties || [];
      if (selectedWard !== "ALL") {
        list = list.filter(p => p.ward === selectedWard);
      }
      if (query) {
        list = list.filter(p => p.name.toLowerCase().includes(query));
      }

      if (list.length === 0) {
        container.innerHTML = '<div class="text-center py-10 text-slate-400 text-xs">条件に合致する提案推奨物件はありません</div>';
        return;
      }

      container.innerHTML = list.map(p => `
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
          <div class="p-4 border-b border-slate-100 flex items-start justify-between gap-3">
            <div>
              <span class="inline-block px-2 py-0.5 bg-slate-900 text-white text-[10px] font-bold rounded mb-1">${p.ward}</span>
              <h2 class="font-bold text-sm text-slate-900 leading-snug">${p.name}</h2>
              <div class="flex items-center gap-3 text-xs text-slate-500 mt-1">
                <span>${p.area}㎡</span>
                <span>坪${p.tsubo_price}万</span>
              </div>
            </div>
            <div class="text-right">
              <span class="inline-block px-2 py-0.5 bg-rose-50 text-rose-600 border border-rose-200 text-[10px] font-bold rounded">
                -${p.price_drop}万 (${p.gap_rate}%)
              </span>
              <div class="text-base font-extrabold text-slate-900 mt-1">${(p.price).toLocaleString()}万円</div>
              <div class="text-[10px] text-slate-400 line-through">${(p.previous_price).toLocaleString()}万円</div>
            </div>
          </div>

          <!-- 4軸提案文タブ -->
          <div class="p-3 bg-slate-50 text-xs space-y-2">
            <div class="text-[11px] font-bold text-slate-600 flex items-center gap-1">
              <i class="fa-solid fa-comment-dots text-emerald-600"></i> 客付け提案トーク（コピー可）
            </div>
            <div class="grid grid-cols-2 gap-1.5">
              <button onclick="copyText('${p.proposals.power_couple}')" class="text-left p-2 bg-white rounded border border-slate-200 hover:border-slate-400 text-[11px]">
                <span class="font-bold text-slate-700 block">ペアローン客</span>
                <span class="text-slate-500 line-clamp-2">${p.proposals.power_couple}</span>
              </button>
              <button onclick="copyText('${p.proposals.family}')" class="text-left p-2 bg-white rounded border border-slate-200 hover:border-slate-400 text-[11px]">
                <span class="font-bold text-slate-700 block">ファミリー実需</span>
                <span class="text-slate-500 line-clamp-2">${p.proposals.family}</span>
              </button>
              <button onclick="copyText('${p.proposals.negotiation}')" class="text-left p-2 bg-white rounded border border-slate-200 hover:border-slate-400 text-[11px]">
                <span class="font-bold text-slate-700 block">指値・交渉狙い</span>
                <span class="text-slate-500 line-clamp-2">${p.proposals.negotiation}</span>
              </button>
              <button onclick="copyText('${p.proposals.yield}')" class="text-left p-2 bg-white rounded border border-slate-200 hover:border-slate-400 text-[11px]">
                <span class="font-bold text-slate-700 block">資産性・リセール</span>
                <span class="text-slate-500 line-clamp-2">${p.proposals.yield}</span>
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function openModal() {
      const s = globalData.stats || {};
      document.getElementById("log-summary").innerHTML = `
        <div class="flex justify-between"><span>総検知件数:</span><span class="font-bold">${s.total_detected || 0}件</span></div>
        <div class="flex justify-between text-slate-500"><span>実需外除外 (40㎡/5000万未満):</span><span>${s.excluded_conditions || 0}件</span></div>
        <div class="flex justify-between text-slate-500"><span>相場乖離大 (見送り):</span><span>${s.excluded_high_price || 0}件</span></div>
        <div class="flex justify-between text-emerald-600 font-bold border-t pt-1"><span>提案推奨掲載:</span><span>${s.recommended || 0}件</span></div>
      `;

      const listContainer = document.getElementById("log-excluded-list");
      const list = globalData.excluded || [];
      if (list.length === 0) {
        listContainer.innerHTML = '<p class="text-slate-400 text-[11px]">除外・見送り物件の記録はありません</p>';
      } else {
        listContainer.innerHTML = list.map(item => `
          <div class="p-2 bg-slate-50 rounded border text-[11px]">
            <div class="font-bold text-slate-700">${item.ward} ｜ ${item.name}</div>
            <div class="text-rose-500">${item.reason}</div>
          </div>
        `).join('');
      }

      document.getElementById("log-modal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("log-modal").classList.add("hidden");
    }

    function copyText(txt) {
      navigator.clipboard.writeText(txt);
      alert("提案文をコピーしました！");
    }

    fetchDeals();
  </script>
</body>
</html>
