<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マンション値下げ速報（実需専用）</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="実需値下げ速報">
  <meta name="theme-color" content="#1f2937">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/city.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/192/city.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-16 select-none">

  <!-- ヘッダー -->
  <header class="bg-[#1f2937] text-white pt-10 pb-3 px-4 sticky top-0 z-20 shadow">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="text-left">
        <div class="flex items-center gap-1.5 text-[10px] text-emerald-400 font-semibold">
          <i data-lucide="shield-check" class="w-3.5 h-3.5"></i>
          <span>実需（居住用）限定</span>
        </div>
        <div id="header-title" class="text-lg font-bold">港区 値下げ速報</div>
        <div id="header-date" class="text-[10px] text-gray-400">データ取得中...</div>
      </div>
      
      <!-- アクションボタン（手動更新 ＆ 設定） -->
      <div class="flex items-center gap-2">
        <button onclick="triggerManualUpdate()" title="今すぐ手動更新"
                id="btn-manual-update"
                class="bg-[#374151] active:bg-[#4b5563] text-white p-2.5 rounded-full shadow transition-all flex items-center justify-center">
          <i data-lucide="refresh-cw" id="icon-refresh" class="w-4 h-4"></i>
        </button>
        <button onclick="openSettingsModal()" title="設定"
                class="bg-[#374151] active:bg-[#4b5563] text-gray-300 p-2.5 rounded-full shadow transition-all flex items-center justify-center">
          <i data-lucide="settings" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- 操作バー（固定） -->
  <div class="bg-white border-b border-gray-200 sticky top-[82px] z-10 p-3 shadow-sm space-y-2">
    <!-- 上段：23区選択セレクト ＆ キーワード検索 -->
    <div class="max-w-md mx-auto flex items-center gap-2">
      <select id="ward-select" onchange="changeWard(this.value)" 
              class="bg-gray-100 border border-gray-300 text-xs font-bold text-gray-800 rounded-lg px-2.5 py-2 focus:outline-none focus:ring-2 focus:ring-[#18446b]">
        <optgroup label="都心エリア">
          <option value="港区" selected>港区</option>
          <option value="千代田区">千代田区</option>
          <option value="中央区">中央区</option>
          <option value="渋谷区">渋谷区</option>
          <option value="新宿区">新宿区</option>
          <option value="文京区">文京区</option>
        </optgroup>
        <optgroup label="湾岸・城東">
          <option value="江東区">江東区</option>
          <option value="品川区">品川区</option>
          <option value="台東区">台東区</option>
          <option value="墨田区">墨田区</option>
          <option value="荒川区">荒川区</option>
          <option value="足立区">足立区</option>
          <option value="葛飾区">葛飾区</option>
          <option value="江戸川区">江戸川区</option>
        </optgroup>
        <optgroup label="城南・城西">
          <option value="目黒区">目黒区</option>
          <option value="世田谷区">世田谷区</option>
          <option value="大田区">大田区</option>
          <option value="中野区">中野区</option>
          <option value="杉並区">杉並区</option>
          <option value="練馬区">練馬区</option>
        </optgroup>
        <optgroup label="城北">
          <option value="豊島区">豊島区</option>
          <option value="北区">北区</option>
          <option value="板橋区">板橋区</option>
        </optgroup>
      </select>

      <div class="relative flex-1">
        <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-3 top-2.5"></i>
        <input type="text" id="search-input" oninput="handleSearch()" placeholder="物件名・駅名・階数..." 
               class="w-full bg-gray-50 border border-gray-300 text-xs rounded-lg pl-8 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#18446b]">
      </div>
    </div>

    <!-- 下段：成約圏内トグル ＆ 仲介会社絞り込み -->
    <div class="max-w-md mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar" id="filter-tabs"></div>
  </div>

  <!-- 物件リスト -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="property-list"></main>

  <!-- 設定モーダル（トークン管理） -->
  <div id="settings-modal" class="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl w-full max-w-sm p-5 shadow-xl text-left space-y-4">
      <div class="flex justify-between items-center border-b pb-2">
        <h3 class="font-bold text-gray-800 flex items-center gap-1.5 text-base">
          <i data-lucide="key" class="w-4 h-4 text-[#18446b]"></i> 手動更新の設定
        </h3>
        <button onclick="closeSettingsModal()" class="text-gray-400 hover:text-gray-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="text-xs text-gray-600 leading-relaxed">
        手動更新ボタンを押した際に、GitHub Actionsを直接動かすためのキーです。（※お使いの端末内にのみ安全に保存されます）
      </div>

      <div class="space-y-1">
        <label class="text-[11px] font-bold text-gray-700">GitHub Personal Access Token</label>
        <input type="password" id="input-token" placeholder="ghp_xxxxxxxxxxxx" 
               class="w-full bg-gray-50 border border-gray-300 text-xs rounded-lg p-2.5 focus:outline-none focus:ring-2 focus:ring-[#18446b]">
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="saveToken()" class="flex-1 bg-[#18446b] active:bg-[#123352] text-white text-xs font-bold py-2.5 rounded-lg shadow">
          保存する
        </button>
        <button onclick="clearToken()" class="bg-gray-100 active:bg-gray-200 text-gray-600 text-xs font-semibold py-2.5 px-3 rounded-lg">
          削除
        </button>
      </div>
    </div>
  </div>

  <script>
    const EXCLUDE_KEYWORDS = ["オーナーチェンジ", "賃貸中", "利回り", "想定利回り", "表面利回り", "現況：賃貸", "投資用", "借家中"];

    let currentWard = localStorage.getItem('selected_ward') || "港区";
    let wardProperties = [];
    let currentSource = "すべて";
    let onlyTargetDeal = false;
    let searchQuery = "";

    const repoOwner = window.location.hostname.split('.')[0] || "122kojimashunsuke-hub";
    const repoName = window.location.pathname.split('/')[1] || "-";

    function analyzeMarket(item) {
      const tsuboVal = parseFloat(item.afterTsubo.replace(/[^0-9.]/g, ''));
      const diffFromMarket = ((tsuboVal - item.marketTsubo) / item.marketTsubo) * 100;
      
      let badgeHtml = "";
      let isTarget = false;

      if (diffFromMarket <= 0) {
        badgeHtml = `<span class="bg-red-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">★ 成約ライン到達 (相場比 ${diffFromMarket.toFixed(1)}%)</span>`;
        isTarget = true;
      } else if (diffFromMarket <= 3.0) {
        badgeHtml = `<span class="bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">● 成約圏内 (相場比 +${diffFromMarket.toFixed(1)}%)</span>`;
        isTarget = true;
      } else if (diffFromMarket <= 8.0) {
        badgeHtml = `<span class="bg-blue-600 text-white text-[10px] font-bold px-2 py-0.5 rounded-full">交渉圏内 (相場比 +${diffFromMarket.toFixed(1)}%)</span>`;
      } else {
        badgeHtml = `<span class="bg-gray-400 text-white text-[10px] font-medium px-2 py-0.5 rounded-full">高値圏 (相場比 +${diffFromMarket.toFixed(1)}%)</span>`;
      }

      return { badgeHtml, isTarget };
    }

    function changeWard(ward) {
      currentWard = ward;
      localStorage.setItem('selected_ward', ward);
      document.getElementById('ward-select').value = ward;
      document.getElementById('header-title').innerText = `${ward} 値下げ速報`;
      loadWardData(ward);
    }

    async function loadWardData(ward) {
      const container = document.getElementById('property-list');
      container.innerHTML = `
        <div class="text-center py-12 text-gray-400 text-sm">
          <i data-lucide="loader" class="w-6 h-6 animate-spin mx-auto mb-2 text-gray-500"></i>
          ${ward}の最新データを取得中...
        </div>
      `;
      lucide.createIcons();

      try {
        const filename = `data/data_${ward}.json`;
        const res = await fetch(`${filename}?t=${new Date().getTime()}`);
        if (!res.ok) throw new Error();

        const data = await res.json();
        document.getElementById('header-date').innerText = `${data.updatedAt} 更新`;

        wardProperties = (data.properties || []).filter(item => {
          const textToCheck = `${item.name} ${item.spec} ${item.source} ${item.notes || ''}`.toLowerCase();
          return !EXCLUDE_KEYWORDS.some(kw => textToCheck.includes(kw.toLowerCase()));
        });

        initFilterTabs();
        renderCards();
      } catch (err) {
        document.getElementById('header-date').innerText = "未取得または更新待ち";
        container.innerHTML = `
          <div class="bg-white rounded-xl p-6 text-center shadow-sm border border-gray-200 text-sm text-gray-500">
            <p class="font-bold text-gray-700 mb-1">${ward}のデータ準備中</p>
            <p class="text-xs text-gray-400">右上の更新ボタンを押して手動更新するか、毎朝7時の自動巡回をお待ちください。</p>
          </div>
        `;
      }
    }

    function initFilterTabs() {
      const tabContainer = document.getElementById('filter-tabs');
      const sources = ["すべて", "すみふの仲介ステップ", "三井のリハウス", "東急リバブル", "ノムコム"];

      let html = sources.map(src => `
        <button onclick="changeSource('${src}')" 
          class="px-3 py-1 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
            src === currentSource 
              ? 'bg-[#18446b] text-white shadow-sm' 
              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
          }">
          ${src}
        </button>
      `).join('');

      html += `
        <button onclick="toggleOnlyTarget()" 
          class="ml-auto px-3 py-1 rounded-full text-xs font-bold whitespace-nowrap transition-all flex items-center gap-1 shrink-0 ${
            onlyTargetDeal 
              ? 'bg-red-600 text-white shadow-sm' 
              : 'bg-red-50 text-red-600 border border-red-200 hover:bg-red-100'
          }">
          <i data-lucide="flame" class="w-3.5 h-3.5"></i> 成約圏内のみ
        </button>
      `;

      tabContainer.innerHTML = html;
      lucide.createIcons();
    }

    function changeSource(src) {
      currentSource = src;
      initFilterTabs();
      renderCards();
    }

    function toggleOnlyTarget() {
      onlyTargetDeal = !onlyTargetDeal;
      initFilterTabs();
      renderCards();
    }

    function handleSearch() {
      searchQuery = document.getElementById('search-input').value.trim().toLowerCase();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('property-list');

      const filtered = wardProperties.filter(p => {
        const market = analyzeMarket(p);
        const matchSource = currentSource === "すべて" || p.source === currentSource;
        const matchTarget = !onlyTargetDeal || market.isTarget;
        const matchSearch = searchQuery === "" || 
          p.name.toLowerCase().includes(searchQuery) || 
          p.spec.toLowerCase().includes(searchQuery);

        return matchSource && matchTarget && matchSearch;
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-400 text-sm">
            該当する値下げ実需物件はありません
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const market = analyzeMarket(item);
        return `
          <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 transition-all">
            <div class="flex justify-between items-center mb-2">
              <div class="flex items-center gap-1.5">
                <span class="bg-gray-800 text-white text-[10px] font-semibold px-2 py-0.5 rounded">${item.area}</span>
                <span class="bg-purple-100 text-purple-700 text-[10px] font-bold px-2 py-0.5 rounded">改定 ${item.revisionCount}回目</span>
              </div>
              <span class="text-xs text-gray-500 font-medium">売出 ${item.elapsedDays}日目</span>
            </div>

            <div class="mb-2">
              ${market.badgeHtml}
            </div>

            <h2 class="text-lg font-bold text-gray-900 leading-snug mb-0.5">${item.name}</h2>
            <p class="text-xs text-gray-500 mb-2">${item.spec}</p>

            <hr class="border-dashed border-gray-300 my-2.5">

            <div class="grid grid-cols-3 gap-2 text-left mb-2.5">
              <div>
                <div class="text-[11px] text-gray-400">改定前</div>
                <div class="text-base font-bold text-gray-800">${item.beforePrice}</div>
                <div class="text-[10px] text-gray-500">(${item.beforeTsubo})</div>
              </div>
              <div>
                <div class="text-[11px] text-gray-400">改定後</div>
                <div class="text-base font-bold text-gray-900 flex items-center">
                  <span class="text-gray-400 text-xs mr-1">→</span>${item.afterPrice}
                </div>
                <div class="text-[10px] text-gray-500">(${item.afterTsubo})</div>
              </div>
              <div>
                <div class="text-[11px] text-gray-400">変動額</div>
                <div class="text-base font-bold text-red-600">${item.diffPrice}</div>
                <div class="text-[10px] text-red-500">${item.diffRate}</div>
              </div>
            </div>

            <div class="flex justify-between items-center text-[11px] text-gray-500 mb-3">
              <span>サイト：${item.source}</span>
              <span>相場基準：約${item.marketTsubo}万/坪</span>
            </div>

            <div class="grid grid-cols-2 gap-2">
              <a href="https://www.google.com/search?q=${encodeURIComponent(item.searchWord)}" 
                 target="_blank" rel="noopener noreferrer"
                 class="flex items-center justify-center gap-1.5 bg-[#18446b] active:bg-[#123352] text-white text-xs font-semibold py-2 px-2 rounded-lg transition text-center shadow-sm">
                <i data-lucide="search" class="w-3.5 h-3.5 shrink-0"></i>
                <span class="truncate">サイトで検索</span>
              </a>
              <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(item.name)}" 
                 target="_blank" rel="noopener noreferrer"
                 class="flex items-center justify-center gap-1.5 bg-[#0f766e] active:bg-[#115e59] text-white text-xs font-semibold py-2 px-2 rounded-lg transition text-center shadow-sm">
                <i data-lucide="map-pin" class="w-3.5 h-3.5 shrink-0"></i>
                <span class="truncate">Googleマップ</span>
              </a>
            </div>
          </div>
        `;
      }).join('');

      lucide.createIcons();
    }

    function openSettingsModal() {
      const modal = document.getElementById('settings-modal');
      const input = document.getElementById('input-token');
      input.value = localStorage.getItem('gh_pat') || '';
      modal.classList.remove('hidden');
    }

    function closeSettingsModal() {
      document.getElementById('settings-modal').classList.add('hidden');
    }

    function saveToken() {
      const val = document.getElementById('input-token').value.trim();
      if (!val) {
        alert("トークンを入力してください");
        return;
      }
      localStorage.setItem('gh_pat', val);
      closeSettingsModal();
      alert("トークンを保存しました！手動更新が使えます。");
    }

    function clearToken() {
      localStorage.removeItem('gh_pat');
      document.getElementById('input-token').value = '';
      closeSettingsModal();
      alert("トークンを削除しました。");
    }

    async function triggerManualUpdate() {
      const token = localStorage.getItem('gh_pat');
      if (!token) {
        alert("手動更新を使うには、まず歯車アイコンからGitHubトークンを登録してください。");
        openSettingsModal();
        return;
      }

      const refreshIcon = document.getElementById('icon-refresh');
      refreshIcon.classList.add('animate-spin');

      try {
        const url = `https://api.github.com/repos/${repoOwner}/${repoName}/actions/workflows/auto_update.yml/dispatches`;
        const res = await fetch(url, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ ref: 'main' })
        });

        if (res.status === 204) {
          alert("自動巡回ロボットを起動しました！\n約1分ほどでデータが更新されます。少し待ってから画面を下に引っ張って更新してください。");
        } else {
          const errData = await res.json();
          alert(`起動に失敗しました (${res.status}):\n${errData.message || 'トークン権限を確認してください'}`);
        }
      } catch (e) {
        alert("通信エラーが発生しました。ネットワークを確認してください。");
      } finally {
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 1000);
      }
    }

    changeWard(currentWard);
  </script>
</body>
</html>
