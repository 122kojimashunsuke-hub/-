<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>マンション値下げ速報</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="値下げ速報">
  <meta name="theme-color" content="#1f2937">
  <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/192/city.png">
  <link rel="icon" type="image/png" href="https://img.icons8.com/fluency/192/city.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans pb-16 select-none">

  <!-- ヘッダー -->
  <header class="bg-[#1f2937] text-white pt-10 pb-3 px-4 text-center sticky top-0 z-20 shadow">
    <div class="text-xs text-gray-400 font-medium">港区マンション価格改定チェッカー</div>
    <div id="header-date" class="text-lg font-bold">読み込み中...</div>
  </header>

  <!-- 絞り込みタブ（大手仲介4社） -->
  <nav class="bg-white border-b border-gray-200 sticky top-[76px] z-10 px-4 py-2.5 shadow-sm">
    <div class="max-w-md mx-auto flex items-center gap-2 overflow-x-auto no-scrollbar" id="filter-tabs"></div>
  </nav>

  <!-- 物件リストコンテナ -->
  <main class="max-w-md mx-auto p-4 space-y-4" id="property-list">
    <div class="text-center py-12 text-gray-400 text-sm">最新データを取得中...</div>
  </main>

  <script>
    let allProperties = [];
    let currentFilter = "すべて";

    // データの読み込み
    async function loadData() {
      try {
        // キャッシュを防ぐためタイムスタンプを付与
        const res = await fetch('data.json?t=' + new Date().getTime());
        const data = await res.json();
        
        document.getElementById('header-date').innerText = data.updatedAt;
        allProperties = data.properties;
        initTabs();
        renderCards();
      } catch (err) {
        document.getElementById('header-date').innerText = "港区 値下げ速報";
        document.getElementById('property-list').innerHTML = `
          <div class="text-center py-12 text-gray-400 text-sm">
            初回データ生成中です。<br>少々お待ちください。
          </div>
        `;
      }
    }

    // 仲介会社別フィルタータブ
    function initTabs() {
      const tabContainer = document.getElementById('filter-tabs');
      const sources = ["すべて", "すみふの仲介ステップ", "三井のリハウス", "東急リバブル", "ノムコム"];

      tabContainer.innerHTML = sources.map(src => `
        <button onclick="changeFilter('${src}')" 
          class="px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-all ${
            src === currentFilter 
              ? 'bg-[#18446b] text-white shadow-sm' 
              : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
          }">
          ${src}
        </button>
      `).join('');
    }

    function changeFilter(src) {
      currentFilter = src;
      initTabs();
      renderCards();
    }

    function renderCards() {
      const container = document.getElementById('property-list');
      const filtered = currentFilter === "すべて" 
        ? allProperties 
        : allProperties.filter(p => p.source === currentFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="text-center py-12 text-gray-400 text-sm">
            該当する値下げ物件はありません
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-4 transition-all">
          <div class="flex justify-between items-center mb-2">
            <span class="bg-gray-800 text-white text-xs font-semibold px-2.5 py-1 rounded">${item.area}</span>
            <span class="text-xs text-gray-500 font-medium">経過日数：${item.elapsedDays}日</span>
          </div>
          <h2 class="text-lg font-bold text-gray-900 leading-snug mb-1">${item.name}</h2>
          <p class="text-xs text-gray-500 mb-3">${item.spec}</p>
          <hr class="border-dashed border-gray-300 my-3">
          <div class="grid grid-cols-3 gap-2 text-left mb-3">
            <div>
              <div class="text-[11px] text-gray-400">改定前</div>
              <div class="text-base font-bold text-gray-800">${item.beforePrice}</div>
              <div class="text-[10px] text-gray-500">(${item.beforeTsubo})</div>
            </div>
            <div>
              <div class="text-[11px] text-gray-400">改定後</div>
              <div class="text-base font-bold text-gray-900 flex items-center">
                <span class="text-gray-400 text-xs mr-1">→</span>${item.afterPrice}
              </div>
              <div class="text-[10px] text-gray-500">(${item.afterTsubo})</div>
            </div>
            <div>
              <div class="text-[11px] text-gray-400">変動額</div>
              <div class="text-base font-bold text-red-600">${item.diffPrice}</div>
              <div class="text-[10px] text-red-500">${item.diffRate}</div>
            </div>
          </div>
          <p class="text-xs text-gray-600 mb-3">価格変動を確認したサイト：<span class="font-medium">${item.source}</span></p>
          <a href="https://www.google.com/search?q=${encodeURIComponent(item.searchWord)}" 
             target="_blank" rel="noopener noreferrer"
             class="flex items-center justify-center gap-2 w-full bg-[#18446b] active:bg-[#123352] text-white text-xs font-semibold py-2.5 px-3 rounded-lg transition">
            <i data-lucide="search" class="w-4 h-4"></i>
            <span class="truncate">「${item.searchWord}」で検索</span>
          </a>
        </div>
      `).join('');

      lucide.createIcons();
    }

    loadData();
  </script>
</body>
</html>
